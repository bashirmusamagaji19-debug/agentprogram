name: CI

on:
  push:
  pull_request:

jobs:
  cloud-browser:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud system packages
        run: apt-get update && xargs -a packages.txt apt-get install -y --no-install-recommends
      - name: Install cloud Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real cloud browser startup
        run: python scripts/smoke_cloud_browser.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: >-
          python -m ruff check
          src tests
      - name: Deterministic test suite
        run: >-
          python -m pytest -p no:cacheprovider
          --cov=web_task_agent
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
