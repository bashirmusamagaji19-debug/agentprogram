[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-task-agent"
version = "0.1.0"
description = "A browser-use and LangGraph based Web task agent for AI internship discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.1.40",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
demo = [
  "streamlit>=1.36",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]

[project.scripts]
web-task-agent = "web_task_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["web_task_agent"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
